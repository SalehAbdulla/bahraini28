# ──────────────────────────────────────────────────────────────────────────
# Bahraini 28 — server blocks for the co-hosted deploy.
#
# This file is NOT served by a container of ours. It is dropped into beyond's
# reverse proxy, the single public entrypoint on this host:
#
#   cp deploy/nginx-bahraini28.conf ~/beyond/docker/nginx/sites/bahraini28.conf
#   docker exec beyond-nginx nginx -t          # must pass BEFORE reloading
#   docker exec beyond-nginx nginx -s reload
#
# beyond-nginx mounts docker/nginx/sites at /etc/nginx/sites (read-only) and its
# nginx.conf ends with `include /etc/nginx/sites/*.conf;`, so a new file there is
# picked up by a reload with no edit to beyond's own config.
#
# TLS: our OWN certificate, with its OWN filenames. beyond's server blocks use
# /etc/nginx/ssl/fullchain.pem + privkey.pem for beyondedubh.com, so writing our
# cert over those names would break every beyond hostname. Issue the cert
# separately and let deploy/certbot-deploy-hook.sh copy it in as bahraini28-*.pem.
#
# Upstream: our Caddy container, reached by its unique alias on the shared
# `beyond-prod` network (see docker-compose.cohost.yml). The variable-based
# proxy_pass is deliberate — nginx re-resolves it per request through Docker's
# DNS resolver (beyond's nginx.conf sets `resolver 127.0.0.11`), so a redeploy
# that gives the container a new IP cannot leave nginx proxying a stale address.
# ──────────────────────────────────────────────────────────────────────────

# Port 80 — ACME HTTP-01 challenge (for renewals) + HTTPS redirect.
server {
    listen 80;
    server_name bahraini28.com www.bahraini28.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 — the app.
server {
    listen 443 ssl;
    server_name bahraini28.com www.bahraini28.com;

    ssl_certificate     /etc/nginx/ssl/bahraini28-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bahraini28-privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Admin SSE live feed (/api/v1/admin/notifications/stream?_token=...).
    # It must STREAM, not buffer — otherwise nginx holds the response and the
    # dashboard's "Live" feed never updates. Kept in its own location so ordinary
    # requests are not handed a 1-hour read timeout.
    location = /api/v1/admin/notifications/stream {
        set $bahraini28_upstream http://bahraini28-web:80;
        proxy_pass $bahraini28_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $bahraini28_upstream http://bahraini28-web:80;
        proxy_pass $bahraini28_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Receipt uploads: the app caps at MAX_UPLOAD_SIZE_MB (10); leave a little
        # headroom for multipart framing. beyond's global limit is 100m.
        client_max_body_size 12m;
    }
}
